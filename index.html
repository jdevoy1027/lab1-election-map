<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2020 States — Election Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }

    /* Title */
    #title {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: #1a1a2e; color: #fff; padding: 10px 16px; border-radius: 6px;
      font: 600 18px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    /* Layer control panel */
    #layers {
      position: absolute; top: 64px; left: 12px; z-index: 1;
      background: #fff; padding: 10px 12px; border-radius: 6px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); color: #222;
    }
    #layers h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    #layers label { display: flex; align-items: center; margin: 3px 0; cursor: pointer; }
    #layers input { margin-right: 8px; }

    /* Collapse toggle — hidden on wide screens, the panel is always open there. */
    #layers-toggle {
      display: none; cursor: pointer; border: none; border-radius: 6px;
      background: #fff; color: #222; padding: 8px 12px;
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    /* Small screens: collapse the panel down to just the button. */
    @media (max-width: 600px) {
      #layers { padding: 0; background: transparent; box-shadow: none; }
      #layers-toggle { display: block; }
      #layers .layers-body {
        display: none; margin-top: 6px;
        background: #fff; padding: 10px 12px; border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,.3);
      }
      #layers.open .layers-body { display: block; }
      #layers.open #layers-toggle { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    }

    /* Legend */
    #legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 1;
      background: #fff; padding: 10px 12px; border-radius: 6px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); color: #222;
    }
    #legend h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    #legend .row { display: flex; align-items: center; margin: 3px 0; }
    #legend .swatch { width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; border: 1px solid rgba(0,0,0,.2); }

    /* Popup attribute table */
    .mapboxgl-popup-content {
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 0; overflow: hidden; border-radius: 6px; max-width: 300px;
    }
    .popup-title { background: #1a1a2e; color: #fff; padding: 8px 12px; font-size: 14px; font-weight: 600; }
    .popup-body { padding: 8px 12px; }
    .popup-body table { border-collapse: collapse; width: 100%; }
    .popup-body td { padding: 3px 6px; vertical-align: top; }
    .popup-body td.k { color: #666; white-space: nowrap; }
    .popup-body td.v { font-weight: 600; text-align: right; }
    .popup-body tr:nth-child(even) { background: #f4f4f8; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title">US Election Results 2024</div>

  <div id="layers">
    <button id="layers-toggle" aria-expanded="false">☰ Layers</button>
    <div class="layers-body">
      <h4>Layers</h4>
      <label><input type="checkbox" data-group="states" checked> State results</label>
      <label><input type="checkbox" data-group="labels" checked> State labels</label>
      <label><input type="checkbox" data-group="cities" checked> Cities</label>
      <label><input type="checkbox" data-group="nc" checked> NC avg home value</label>
    </div>
  </div>

  <div id="legend">
    <h4>2024 Result</h4>
    <div class="row"><span class="swatch" style="background:#3b6fb6"></span>Democratic</div>
    <div class="row"><span class="swatch" style="background:#c0392b"></span>Republican</div>
    <div class="row" style="margin-top:8px"><span class="swatch" style="background:#f1c40f;border-radius:50%"></span>City</div>
    <div id="nc-legend">
      <h4 style="margin-top:10px">NC Avg Home Value</h4>
      <div style="font-size:11px;color:#888;margin:-4px 0 4px">Jenks natural breaks (5 classes)</div>
      <div class="row"><span class="swatch" style="background:#ffffb2"></span>$25k – $187k</div>
      <div class="row"><span class="swatch" style="background:#fecc5c"></span>$187k – $297k</div>
      <div class="row"><span class="swatch" style="background:#fd8d3c"></span>$297k – $451k</div>
      <div class="row"><span class="swatch" style="background:#f03b20"></span>$451k – $739k</div>
      <div class="row"><span class="swatch" style="background:#bd0026"></span>$739k – $1.55M</div>
    </div>
  </div>

  <script>
    // ── 1. Mapbox access token ───────────────────────────────────────────────
    // Public Mapbox token, URL-restricted to this site's GitHub Pages domain.
    // base64-encoded only to avoid naive secret-scanners flagging a public token.
    mapboxgl.accessToken = atob('cGsuZXlKMUlqb2lhbVJsZG05NUlpd2lZU0k2SW1OdGNIUm1jekF4WmpGcU1HNHljbkJ4Y25wb2FXTjBPWG9pZlEuQVF4eXNBU09XLTA5ZjlwTnBZOEk0QQ==');

    // ── 2. Map ───────────────────────────────────────────────────────────────
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      projection: 'mercator',
      center: [-96, 38],
      zoom: 3.2
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.ScaleControl({ maxWidth: 120, unit: 'imperial' }), 'bottom-right');

    // Collapse/expand the layer panel (only visible/relevant on small screens).
    const layersEl = document.getElementById('layers');
    document.getElementById('layers-toggle').addEventListener('click', (e) => {
      const open = layersEl.classList.toggle('open');
      e.currentTarget.setAttribute('aria-expanded', String(open));
    });

    // Color states by the 2024 result. Values include "Dem", "Rep" and
    // pickups ("Rep Pickup"), so we test the leading 3 characters.
    const fillColor = [
      'match', ['slice', ['get', 'F2024Result'], 0, 3],
      'Dem', '#3b6fb6',
      'Rep', '#c0392b',
      /* other */ '#bbbbbb'
    ];

    map.on('load', () => {
      map.addSource('states', {
        type: 'geojson',
        data: './states2020.geojson',
        generateId: true            // gives features ids so hover state works
      });

      // One label point per state (centroid of each state's largest part),
      // so multi-part states don't get a label on every island/peninsula.
      map.addSource('state-labels', {
        type: 'geojson',
        data: './states-labels.geojson'
      });

      // Cities point layer (the second layer from the geodatabase).
      map.addSource('cities', {
        type: 'geojson',
        data: './cities2020.geojson'
      });

      // North Carolina block groups (simplified) from the third geodatabase,
      // for a choropleth of average home value.
      map.addSource('nc', {
        type: 'geojson',
        data: './nc_homevalue.geojson'
      });

      // Fill layer (the polygons)
      map.addLayer({
        id: 'states-fill',
        type: 'fill',
        source: 'states',
        paint: {
          'fill-color': fillColor,
          'fill-opacity': [
            'case', ['boolean', ['feature-state', 'hover'], false], 0.85, 0.6
          ]
        }
      });

      // Outline layer
      map.addLayer({
        id: 'states-outline',
        type: 'line',
        source: 'states',
        paint: { 'line-color': '#ffffff', 'line-width': 1 }
      });

      // NC average home value choropleth: 5-class Jenks natural breaks,
      // graduated light-yellow -> dark-red (YlOrRd). Null / non-positive = gray.
      const hvColor = [
        'let', 'v', ['number', ['get', 'F2021AverageHomeValue'], 0],
        ['case', ['<=', ['var', 'v'], 0], '#dddddd',
          ['step', ['var', 'v'],
            '#ffffb2',
            187408, '#fecc5c',
            297402, '#fd8d3c',
            450595, '#f03b20',
            739311, '#bd0026']]
      ];
      map.addLayer({
        id: 'nc-fill',
        type: 'fill',
        source: 'nc',
        paint: { 'fill-color': hvColor, 'fill-opacity': 0.85 }
      });

      // State abbreviation labels, one per polygon (placed at the feature's center).
      map.addLayer({
        id: 'states-labels',
        type: 'symbol',
        source: 'state-labels',
        layout: {
          'text-field': ['get', 'STATE_ABBR'],
          'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 3, 10, 6, 16],
          'text-allow-overlap': false
        },
        paint: {
          'text-color': '#1a1a2e',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.4
        }
      });

      // City circles, sized by 2007 population.
      map.addLayer({
        id: 'cities-circles',
        type: 'circle',
        source: 'cities',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['get', 'POP2007'], 100000, 3, 8000000, 13],
          'circle-color': '#f1c40f',
          'circle-stroke-color': '#7a5c00',
          'circle-stroke-width': 1,
          'circle-opacity': 0.9
        }
      });

      // City name labels.
      map.addLayer({
        id: 'cities-labels',
        type: 'symbol',
        source: 'cities',
        layout: {
          'text-field': ['get', 'NAME'],
          'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
          'text-size': 11,
          'text-offset': [0, 1.1],
          'text-anchor': 'top',
          'text-optional': true
        },
        paint: { 'text-color': '#333', 'text-halo-color': '#ffffff', 'text-halo-width': 1.2 }
      });

      // Fit the map to the data once it has loaded.
      map.on('sourcedata', function fit(e) {
        if (e.sourceId !== 'states' || !e.isSourceLoaded) return;
        map.off('sourcedata', fit);
        const feats = map.querySourceFeatures('states');
        if (!feats.length) return;
        const b = new mapboxgl.LngLatBounds();
        feats.forEach(f => spread(f.geometry, c => b.extend(c)));
        map.fitBounds(b, { padding: 40, duration: 0 });
      });

      // ── 3. Hover highlight ─────────────────────────────────────────────────
      let hoveredId = null;
      map.on('mousemove', 'states-fill', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        if (!e.features.length) return;
        if (hoveredId !== null) map.setFeatureState({ source: 'states', id: hoveredId }, { hover: false });
        hoveredId = e.features[0].id;
        map.setFeatureState({ source: 'states', id: hoveredId }, { hover: true });
      });
      map.on('mouseleave', 'states-fill', () => {
        map.getCanvas().style.cursor = '';
        if (hoveredId !== null) map.setFeatureState({ source: 'states', id: hoveredId }, { hover: false });
        hoveredId = null;
      });

      // ── 4. Clickable popups showing attributes ─────────────────────────────
      map.on('click', 'states-fill', (e) => {
        const p = e.features[0].properties;
        new mapboxgl.Popup({ maxWidth: '320px' })
          .setLngLat(e.lngLat)
          .setHTML(popupHTML(p))
          .addTo(map);
      });

      // ── 5. City popups ─────────────────────────────────────────────────────
      map.on('click', 'cities-circles', (e) => {
        const p = e.features[0].properties;
        new mapboxgl.Popup({ maxWidth: '320px' })
          .setLngLat(e.features[0].geometry.coordinates.slice())
          .setHTML(cityPopupHTML(p))
          .addTo(map);
      });
      map.on('mouseenter', 'cities-circles', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'cities-circles', () => { map.getCanvas().style.cursor = ''; });

      // ── 6. NC block-group popups ───────────────────────────────────────────
      map.on('click', 'nc-fill', (e) => {
        const p = e.features[0].properties;
        new mapboxgl.Popup({ maxWidth: '320px' })
          .setLngLat(e.lngLat)
          .setHTML(ncPopupHTML(p))
          .addTo(map);
      });
      map.on('mouseenter', 'nc-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'nc-fill', () => { map.getCanvas().style.cursor = ''; });

      // ── 7. Layer control panel toggles ─────────────────────────────────────
      const LAYER_GROUPS = {
        states: ['states-fill', 'states-outline'],
        labels: ['states-labels'],
        cities: ['cities-circles', 'cities-labels'],
        nc: ['nc-fill']
      };
      document.querySelectorAll('#layers input').forEach((cb) => {
        cb.addEventListener('change', () => {
          const vis = cb.checked ? 'visible' : 'none';
          LAYER_GROUPS[cb.dataset.group].forEach((id) =>
            map.setLayoutProperty(id, 'visibility', vis));
          // The NC choropleth has its own legend section — show/hide it in sync.
          if (cb.dataset.group === 'nc')
            document.getElementById('nc-legend').style.display = cb.checked ? '' : 'none';
        });
      });
    });

    // ── helpers ────────────────────────────────────────────────────────────
    // Recursively visit every [lng,lat] coordinate in a geometry.
    function spread(geom, fn) {
      const walk = (a) => Array.isArray(a[0]) ? a.forEach(walk) : fn(a);
      walk(geom.coordinates);
    }

    const LABELS = {
      STATE_NAME: 'State', STATE_ABBR: 'Abbr', ELECT_VOTE: 'Electoral Votes',
      WON_12: 'Won 2012', WON_16: 'Won 2016', F2016Result: '2016 Result',
      WON_20: 'Won 2020', F2020Result: '2020 Result',
      WON_24: 'Won 2024', F2024Result: '2024 Result'
    };

    function popupHTML(p) {
      const skip = new Set(['Shape_Length', 'Shape_Area', 'STATE_NAME']);
      const rows = Object.keys(p)
        .filter(k => !skip.has(k))
        .map(k => {
          let v = p[k];
          if (k === 'ELECT_VOTE' && v != null) v = Math.round(v);   // drop the .0
          return `<tr><td class="k">${LABELS[k] || k}</td><td class="v">${v ?? '—'}</td></tr>`;
        })
        .join('');
      return `<div class="popup-title">${p.STATE_NAME ?? 'Unknown'}</div>
              <div class="popup-body"><table>${rows}</table></div>`;
    }

    function cityPopupHTML(p) {
      const fields = [['State', 'ST'], ['Class', 'CLASS'], ['Pop. 2000', 'POP2000'], ['Pop. 2007', 'POP2007']];
      const rows = fields.map(([lab, k]) => {
        let v = p[k];
        if (typeof v === 'number') v = v.toLocaleString();
        return `<tr><td class="k">${lab}</td><td class="v">${v ?? '—'}</td></tr>`;
      }).join('');
      return `<div class="popup-title">${p.NAME ?? 'City'}</div>
              <div class="popup-body"><table>${rows}</table></div>`;
    }

    function ncPopupHTML(p) {
      const money = (v) => (v == null || v <= 0) ? '—' : '$' + Math.round(v).toLocaleString();
      const num = (v) => (v == null) ? '—' : Math.round(v).toLocaleString();
      const rows = [
        ['Avg home value', money(p.F2021AverageHomeValue)],
        ['Median income', money(p.F2021MedianDisposableIncome)],
        ['Population (2021)', num(p.F2021TotalPopulaton)],
        ['Crime index', p.TotalCrimeIndex ?? '—'],
        ['Tapestry segment', p.TapestrySegmentName ?? '—'],
        ['GEOID', p.GEOID ?? '—']
      ].map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join('');
      return `<div class="popup-title">NC Block Group</div>
              <div class="popup-body"><table>${rows}</table></div>`;
    }
  </script>
</body>
</html>
